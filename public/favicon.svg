<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1b120c" />
  <!-- Cabin roof -->
  <polygon points="32,10 8,30 14,30 32,15 50,30 56,30" fill="#2d4231" />
  <!-- Cabin body -->
  <rect x="16" y="28" width="32" height="26" rx="2" fill="#382517" stroke="#25170d" stroke-width="2" />
  <!-- Chimney -->
  <rect x="42" y="14" width="6" height="12" fill="#4d3523" />
  <!-- Window with warm amber glow -->
  <rect x="22" y="34" width="8" height="10" rx="1" fill="#f59e0b" opacity="0.9" />
  <line x1="26" y1="34" x2="26" y2="44" stroke="#382517" stroke-width="1.5" />
  <line x1="22" y1="39" x2="30" y2="39" stroke="#382517" stroke-width="1.5" />
  <!-- Door with warm slit -->
  <rect x="36" y="36" width="8" height="18" rx="1" fill="#24160b" />
  <circle cx="42" cy="45" r="1" fill="#d97706" />
  <!-- Warm glow from fireplace chimney smoke / spark -->
  <circle cx="45" cy="9" r="2" fill="#f59e0b" opacity="0.8" />
  <circle cx="47" cy="5" r="1.5" fill="#f97316" opacity="0.5" />
</svg>